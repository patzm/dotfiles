# Hyprland 0.55+ layerrule syntax (first migration pass)
# NOTE: this keeps your original intent for blur on common layer namespaces.

layerrule {
  name = rofi-blur
  match:namespace = rofi
  blur = true
  ignore_alpha = 0.0
}

layerrule {
  name = notifications-blur
  match:namespace = notifications
  blur = true
  ignore_alpha = 0.0
}

layerrule {
  name = quickshell-overview-blur
  match:namespace = quickshell:overview
  blur = true
  ignore_alpha = 0.5
}
