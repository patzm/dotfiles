# screenshare tags
windowrule {
  name = tag-screenshare-obs
  match:class = ^(com.obsproject.Studio)$
  tag = +screenshare
}

# IM tags
windowrule {
  name = tag-im-discord
  match:class = ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$
  tag = +im
}
windowrule {
  name = tag-im-ferdium
  match:class = ^([Ff]erdium)$
  tag = +im
}
windowrule {
  name = tag-im-whatsapp
  match:class = ^([Ww]hatsapp-for-linux)$
  tag = +im
}
windowrule {
  name = tag-im-zapzap
  match:class = ^(ZapZap|com.rtosta.zapzap)$
  tag = +im
}
windowrule {
  name = tag-im-telegram
  match:class = ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$
  tag = +im
}
windowrule {
