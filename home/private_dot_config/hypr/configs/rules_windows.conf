# file manager tags
windowrule {
  name = tag-filemanagers
  match:class = ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$
  tag = +file-manager
}
windowrule {
  name = tag-filemanager-warp
  match:class = ^(app.drey.Warp)$
  tag = +file-manager
}

# wallpaper tags
windowrule {
  name = tag-wallpaper-waytrogen
  match:class = ^([Ww]aytrogen)$
  tag = +wallpaper
}

# multimedia tags
windowrule {
  name = tag-music-plexamp
  match:class = ^(Plexamp)$
  tag = +music
}
windowrule {
  name = plexamp-pseudo
  match:class = ^(Plexamp)$
  pseudo = true
}
windowrule {
  name = plexamp-size
  match:class = ^(Plexamp)$
  size = 1000 750
}

# multimedia video tags
windowrule {
  name = tag-multimedia-video
  match:class = ^([Mm]pv|vlc)$
  tag = +multimedia_video
}

# settings tags
windowrule {
  name = tag-settings-hotspot
  match:class = ^(wihotspot(-gui)?)$
  tag = +settings
}
windowrule {
  name = tag-settings-baobab
  match:class = ^([Bb]aobab|org.gnome.[Bb]aobab)$
  tag = +settings
}
windowrule {
  name = tag-settings-disks
  match:class = ^(gnome-disks|wihotspot(-gui)?)$
  tag = +settings
}
windowrule {
  name = tag-settings-kvantum
  match:title = (Kvantum Manager)
  tag = +settings
}
windowrule {
  name = tag-settings-fileroller
  match:class = ^(file-roller|org.gnome.FileRoller)$
  tag = +settings
}
windowrule {
  name = tag-settings-net-blueman
  match:class = ^(nm-applet|nm-connection-editor|blueman-manager)$
  tag = +settings
}
windowrule {
  name = tag-settings-pavu
  match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
  tag = +settings
}
windowrule {
  name = tag-settings-qtct
  match:class = ^(qt5ct|qt6ct|[Yy]ad)$
  tag = +settings
}
windowrule {
  name = tag-settings-xdg-portal-gtk
  match:class = (xdg-desktop-portal-gtk)
  tag = +settings
}
windowrule {
  name = tag-settings-polkit
  match:class = ^(org.kde.polkit-kde-authentication-agent-1)$
  tag = +settings
}
windowrule {
  name = tag-settings-rofi
  match:class = ^([Rr]ofi)$
  tag = +settings
}

# viewer tags
windowrule {
  name = tag-viewer-system-monitor
  match:class = ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$
  tag = +viewer
}
windowrule {
  name = tag-viewer-evince
  match:class = ^(evince)$
  tag = +viewer
}
windowrule {
  name = tag-viewer-image
  match:class = ^(eog|org.gnome.Loupe)$
  tag = +viewer
}

# special overrides
windowrule {
  name = multimedia-video-no-blur
  match:tag = multimedia_video*
  no_blur = true
}
windowrule {
  name = multimedia-video-opacity
  match:tag = multimedia_video*
  opacity = 1.0
}

# positioning
windowrule {
  name = center-thunar-dialog
  match:class = ([Tt]hunar)
  match:title = negative:(.*[Tt]hunar.*)
  center = true
}
windowrule {
  name = center-keybindings
  match:title = ^(Keybindings)$
  center = true
}
windowrule {
  name = center-pavu
  match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
  center = true
}
windowrule {
  name = center-zapzap-whatsapp
  match:class = ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
  center = true
}
windowrule {
  name = center-ferdium
  match:class = ^([Ff]erdium)$
  center = true
}
windowrule {
  name = pip-move
  match:title = ^(Picture-in-Picture)$
  move = 72% 7%
}

# inhibit idle for fullscreen
windowrule {
  name = idleinhibit-fullscreen
  match:fullscreen = true
  idle_inhibit = fullscreen
}

# workspace assignment
windowrule {
  name = ws-orga
  match:tag = orga
  workspace = 4
}
windowrule {
  name = ws-email
  match:tag = email
  workspace = 5
}
windowrule {
  name = ws-chat
  match:tag = chat
  workspace = 5
}
windowrule {
  name = ws-gamestore
  match:tag = gamestore*
  workspace = 5
}
windowrule {
  name = ws-im
  match:tag = im*
  workspace = 7
}
windowrule {
  name = ws-git
  match:tag = git
  workspace = 9
}

# workspace assignment (silent)
windowrule {
  name = ws-screenshare-silent
  match:tag = screenshare*
  workspace = 4 silent
}
windowrule {
  name = ws-virt-manager-silent
  match:class = ^(virt-manager)$
  workspace = 6 silent
}
windowrule {
  name = ws-virt-manager-wrapped-silent
  match:class = ^(.virt-manager-wrapped)$
  workspace = 6 silent
}
windowrule {
  name = ws-special-music
  match:tag = music
  workspace = special:music
}

# float
windowrule {
  name = float-wallpaper
  match:tag = wallpaper*
  float = true
}
windowrule {
  name = float-settings
  match:tag = settings*
  float = true
}
windowrule {
  name = float-viewer
  match:tag = viewer*
  float = true
}
windowrule {
  name = float-zoom-onedriver
  match:class = ([Zz]oom|onedriver|onedriver-launcher)$
  float = true
}
windowrule {
  name = float-mpv-clapper
  match:class = ^(mpv|com.github.rafostar.Clapper)$
  float = true
}
windowrule {
  name = float-qalculate
  match:class = ^([Qq]alculate-gtk)$
  float = true
}
windowrule {
  name = float-ferdium
  match:class = ^([Ff]erdium)$
  float = true
}
windowrule {
  name = float-pip
  match:title = ^(Picture-in-Picture)$
  float = true
}

# popup/dialog handling
windowrule {
  name = tag-popup-auth
  match:title = ^(Authentication Required)$
  tag = +popup
}
windowrule {
  name = center-popup-auth
  match:title = ^(Authentication Required)$
  center = true
}
windowrule {
  name = float-codium-popup
  match:class = (codium|codium-url-handler|VSCodium)
  match:title = negative:(.*codium.*|.*VSCodium.*)
  float = true
}
windowrule {
  name = float-heroic-popup
  match:class = ^(com.heroicgameslauncher.hgl)$
  match:title = negative:(Heroic Games Launcher)
  float = true
}
windowrule {
  name = float-steam-popup
  match:class = ^([Ss]team)$
  match:title = negative:^([Ss]team)$
  float = true
}
windowrule {
  name = float-thunar-popup
  match:class = ([Tt]hunar)
  match:title = negative:(.*[Tt]hunar.*)
  float = true
}
windowrule {
  name = float-add-folder
  match:title = ^(Add Folder to Workspace)$
  float = true
}
windowrule {
  name = size-add-folder
  match:title = ^(Add Folder to Workspace)$
  size = 70% 60%
}
windowrule {
  name = center-add-folder
  match:title = ^(Add Folder to Workspace)$
  center = true
}
windowrule {
  name = float-save-as
  match:title = ^(Save As)$
  float = true
}
windowrule {
  name = size-save-as
  match:title = ^(Save As)$
  size = 70% 60%
}
windowrule {
  name = center-save-as
  match:title = ^(Save As)$
  center = true
}
windowrule {
  name = tag-popup-open-files
  match:initial_title = (Open Files)
  tag = +popup
}
windowrule {
  name = size-popup-open-files
  match:initial_title = (Open Files)
  size = 70% 60%
}
windowrule {
  name = float-popup-tag
  match:tag = popup*
  float = true
}

# pseudo
windowrule {
  name = pseudo-calculator
  match:class = (org.gnome.Calculator)
  match:title = (Calculator)
  pseudo = true
}
windowrule {
  name = size-calculator
  match:class = (org.gnome.Calculator)
  match:title = (Calculator)
  size = 440 640
}
windowrule {
  name = pseudo-thunderbird-select-calendar
  match:class = (thunderbird)
  match:title = (Select Calendar)
  pseudo = true
}
windowrule {
  name = size-thunderbird-select-calendar
  match:class = (thunderbird)
  match:title = (Select Calendar)
  size = 400 600
}

# opacity
windowrule {
  name = opacity-browser
  match:tag = browser*
  opacity = 1.0 0.9
}
windowrule {
  name = opacity-projects
  match:tag = projects*
  opacity = 0.9 0.8
}
windowrule {
  name = opacity-im
  match:tag = im*
  opacity = 0.94 0.86
}
windowrule {
  name = opacity-file-manager
  match:tag = file-manager*
  opacity = 0.9 0.8
}
windowrule {
  name = opacity-terminal
  match:tag = terminal*
  opacity = 0.8 0.7
}
windowrule {
  name = opacity-settings
  match:tag = settings*
  opacity = 0.8 0.7
}
windowrule {
  name = opacity-viewer
  match:tag = viewer*
  opacity = 0.82 0.75
}
windowrule {
  name = opacity-wallpaper
  match:tag = wallpaper*
  opacity = 0.9 0.7
}
windowrule {
  name = opacity-editors
  match:class = ^(gedit|org.gnome.TextEditor|mousepad)$
  opacity = 0.8 0.7
}
windowrule {
  name = opacity-deluge
  match:class = ^(deluge)$
  opacity = 0.9 0.8
}
windowrule {
  name = opacity-seahorse
  match:class = ^(seahorse)$
  opacity = 0.9 0.8
}
windowrule {
  name = opacity-pip
  match:title = ^(Picture-in-Picture)$
  opacity = 0.95 0.75
}
windowrule {
  name = opacity-code
  match:class = ^(code)$
  opacity = 0.8
}

# size
windowrule {
  name = size-wallpaper
  match:tag = wallpaper*
  size = 70% 70%
}
windowrule {
  name = size-settings
  match:tag = settings*
  size = 70% 70%
}
windowrule {
  name = size-whatsapp-zapzap
  match:class = ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
  size = 60% 70%
}
windowrule {
  name = size-ferdium
  match:class = ^([Ff]erdium)$
  size = 60% 70%
}

# pinning / aspect ratio for PiP
windowrule {
  name = pin-pip
  match:title = ^(Picture-in-Picture)$
  pin = true
}
windowrule {
  name = keep-aspect-pip
  match:title = ^(Picture-in-Picture)$
  keep_aspect_ratio = true
}

# games
windowrule {
  name = games-no-blur
  match:tag = games*
  no_blur = true
}
windowrule {
  name = games-fullscreen
  match:tag = games*
  fullscreen = true
}

# focus behavior
windowrule {
  name = no-initial-focus-jetbrains
  match:class = ^(jetbrains-*)
  no_initial_focus = true
}
windowrule {
  name = no-initial-focus-wind
  match:title = ^(wind.*)$
  no_initial_focus = true
}
