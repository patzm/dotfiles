}
windowrule {
  name = tag-orga-contacts
  match:class = ^(org.gnome.Contacts)$
  tag = +orga
}
windowrule {
  name = tag-orga-todo
  match:class = ^(org.gnome.Todo)$
  tag = +orga
}

# email tags
windowrule {
  name = tag-email-geary
  match:class = ^(org.gnome.(Evolution|Geary))$
  tag = +email
}
windowrule {
  name = tag-email-thunderbird
  match:class = ^([Tt]hunderbird)$
  tag = +email
}
windowrule {
  name = tag-email-betterbird
  match:class = ^(eu.betterbird.Betterbird)$
  tag = +email
}

# chat tags
windowrule {
